<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#eee9dc"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>敲敲我们的小宇宙</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;min-height:100svh;display:grid;place-items:center;background:#eee9dc;color:#404939;font-family:system-ui,sans-serif;background-image:radial-gradient(#92947c22 .8px,transparent .8px);background-size:7px 7px}main{width:min(92vw,420px);padding:32px 24px;background:#fcf7e9;box-shadow:5px 7px 0 #ddd6c7,0 20px 50px #50482a18;position:relative;border:1px solid #e2ddcc;border-radius:3px}main:before{content:'';position:absolute;width:110px;height:28px;background:#b5c3a3aa;left:calc(50% - 55px);top:-13px;transform:rotate(5deg)}small{font-size:9px;letter-spacing:3px;color:#7c876a}.star{font-size:42px;color:#b76c4e;margin:18px 0 10px}h1{font-family:serif;font-weight:500;font-size:29px;line-height:1.6;margin:0 0 10px}p{color:#8c8b78;font-size:12px;line-height:1.9}label{display:block;font-size:15px;margin-top:24px;line-height:1.8}input{font:16px sans-serif;width:100%;padding:14px;border:1px solid #b6bca5;background:#f4f0e4;margin:15px 0;color:#404939;border-radius:4px}button{width:100%;background:#687856;color:#fff;border:0;border-radius:4px;padding:15px;font-size:14px;cursor:pointer}button:disabled{opacity:.5}#message{color:#ad634b;min-height:24px}footer{font:italic 20px Georgia;margin:20px 0 0;color:#737c63;text-align:right}
</style></head><body><main><small>OUR LITTLE UNIVERSE</small><div class="star">✦</div><h1>敲敲门，<br>这里藏着我们的回忆。</h1><p>输入属于我们的日期，<br>让收藏的时光慢慢亮起来。</p><form id="unlock"><label for="answer">我们的纪念日第一天从什么时候开始？</label><input id="answer" type="password" inputmode="numeric" placeholder="请输入八位日期" autocomplete="off" required maxlength="80"><button id="submit">打开我们的小宇宙 ↗</button><p id="message" role="status" aria-live="polite"></p></form><p>照片在此设备解密。关闭后，再次输入日期即可打开。<br>如果微信无法加载，可点右上角选择在浏览器中打开。</p><footer>you & me ♡</footer></main><script src="unlock.js"></script></body></html>
