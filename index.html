<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff4f1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>敲敲我们的小宇宙</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;min-height:100svh;display:grid;place-items:center;background:#eee9dc;color:#404939;font-family:system-ui,sans-serif;background-image:radial-gradient(#92947c22 .8px,transparent .8px);background-size:7px 7px}main{width:min(92vw,420px);padding:32px 24px;background:#fcf7e9;box-shadow:5px 7px 0 #ddd6c7,0 20px 50px #50482a18;position:relative;border:1px solid #e2ddcc;border-radius:3px}main:before{content:'';position:absolute;width:110px;height:28px;background:#b5c3a3aa;left:calc(50% - 55px);top:-13px;transform:rotate(5deg)}small{font-size:9px;letter-spacing:3px;color:#7c876a}.star{font-size:42px;color:#b76c4e;margin:18px 0 10px}h1{font-family:serif;font-weight:500;font-size:29px;line-height:1.6;margin:0 0 10px}p{color:#8c8b78;font-size:12px;line-height:1.9}label{display:block;font-size:15px;margin-top:24px;line-height:1.8}input{font:16px sans-serif;width:100%;padding:14px;border:1px solid #b6bca5;background:#f4f0e4;margin:15px 0;color:#404939;border-radius:4px}button{width:100%;background:#687856;color:#fff;border:0;border-radius:4px;padding:15px;font-size:14px;cursor:pointer}button:disabled{opacity:.5}#message{color:#ad634b;min-height:24px}footer{font:italic 20px Georgia;margin:20px 0 0;color:#737c63;text-align:right}

body{padding:28px 16px;background:radial-gradient(ellipse at 12% 15%,#ffe0e9,transparent 48%),radial-gradient(ellipse at 90% 85%,#e9e2f4,transparent 48%),#fff9f2;color:#886c76}
main{width:min(100%,420px);padding:28px 25px;background:#fffdf8d9;box-shadow:0 20px 70px #bca0b320;border:1px solid white;border-radius:32px;text-align:center}
main:before{content:'♡';background:none;color:#e4baca;width:auto;height:auto;left:auto;right:23px;top:30px;font:25px serif}
small{letter-spacing:2.5px;color:#b396a3}.star{width:116px;height:76px;margin:19px auto 12px;animation:sweetBob 4s ease-in-out infinite}.star svg{width:100%;height:100%;overflow:visible}
h1{font-family:'KaiTi','STKaiti',serif;font-size:27px;color:#ac7e8c}p{color:#a18c93}label{font-size:14px;color:#8f7580}input{border:1px solid #e8d1dc;background:#fffaf8;color:#936f7d;border-radius:16px;text-align:center;outline:none}input:focus{border-color:#cda7bd;box-shadow:0 0 0 3px #f6e1eb}button{background:linear-gradient(115deg,#d7a9ba,#b9adc9);border-radius:18px;box-shadow:0 5px 13px #c7a9b62a}button:focus-visible{outline:3px solid #a38fae;outline-offset:3px}#message{color:#b57789;margin:8px 0}footer{font-size:18px;color:#c19eae;text-align:center;margin-top:15px}

</style></head><body><main><small>OUR LITTLE UNIVERSE</small><div class="star" aria-hidden="true"><svg viewBox="0 0 120 80"><path d="M21 65C0 65 0 37 20 34 17 10 50 1 62 23 78 5 106 18 102 38 125 45 113 67 96 67Z" fill="#f5dce7" stroke="#fff8fa" stroke-width="4"/><circle cx="43" cy="47" r="2.5" fill="#b08d9d"/><circle cx="76" cy="47" r="2.5" fill="#b08d9d"/><path d="M55 53q5 6 10 0" fill="none" stroke="#b08d9d" stroke-width="2" stroke-linecap="round"/><ellipse cx="34" cy="54" rx="6" ry="3" fill="#ebbdcf"/><ellipse cx="85" cy="54" rx="6" ry="3" fill="#ebbdcf"/></svg></div><h1>敲敲门，<br>这里藏着我们的甜蜜。</h1><p>输入属于我们的日期，<br>让软软的云朵，带你回到心动那天。</p><form id="unlock"><label for="answer">我们的纪念日第一天从什么时候开始？</label><input id="answer" type="password" inputmode="numeric" placeholder="请输入八位日期" autocomplete="off" required maxlength="80"><button id="submit">打开我们的甜蜜回忆 ♡</button><p id="message" role="status" aria-live="polite"></p></form><p>照片在此设备解密。关闭后，再次输入日期即可打开。<br>如果微信无法加载，可点右上角选择在浏览器中打开。</p><footer>you & me ♡</footer></main><script src="unlock.js"></script></body></html>
